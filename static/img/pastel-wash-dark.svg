<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" preserveAspectRatio="none">
 <defs>
  <radialGradient id="y"><stop stop-color="#a48e55" stop-opacity=".94"/><stop offset=".38" stop-color="#a48e55" stop-opacity=".72"/><stop offset="1" stop-color="#a48e55" stop-opacity="0"/></radialGradient>
  <radialGradient id="p"><stop stop-color="#a27390" stop-opacity=".9"/><stop offset=".4" stop-color="#a27390" stop-opacity=".64"/><stop offset="1" stop-color="#a27390" stop-opacity="0"/></radialGradient>
  <radialGradient id="b"><stop stop-color="#6384a8" stop-opacity=".9"/><stop offset=".42" stop-color="#6384a8" stop-opacity=".65"/><stop offset="1" stop-color="#6384a8" stop-opacity="0"/></radialGradient>
  <filter id="wash" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
   <feTurbulence type="fractalNoise" baseFrequency=".006 .009" numOctaves="2" seed="17" result="flow"/>
   <feDisplacementMap in="SourceGraphic" in2="flow" scale="56" xChannelSelector="R" yChannelSelector="G"/>
   <feGaussianBlur stdDeviation="18"/>
  </filter>
  <filter id="bloom" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="38"/></filter>
 </defs>
 <rect width="1000" height="1000" fill="#2c303a"/>
 <!-- Direction follows the original: yellow upper right, pink centre, blue lower left, paper edge. -->
 <g filter="url(#wash)">
  <ellipse cx="970" cy="110" rx="680" ry="670" fill="url(#y)" transform="rotate(-22 970 110)"/>
  <ellipse cx="610" cy="455" rx="590" ry="590" fill="url(#p)" transform="rotate(-33 610 455)"/>
  <ellipse cx="230" cy="780" rx="620" ry="580" fill="url(#b)" transform="rotate(28 230 780)"/>
 </g>
 <g filter="url(#bloom)" opacity=".38">
  <ellipse cx="885" cy="150" rx="235" ry="310" fill="url(#y)"/>
  <ellipse cx="605" cy="495" rx="205" ry="250" fill="url(#p)"/>
  <ellipse cx="190" cy="800" rx="240" ry="190" fill="url(#b)"/>
 </g>
</svg>